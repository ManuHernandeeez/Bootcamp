<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla de Nutrición</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: white;
    margin: 40px;
    color: #000;
}

.nutrition h2 {
    color: #5c2b0e;
    margin-bottom: 10px;
}

.nutrition p {
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td {
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    font-size: 16px;
}

td.value {
    text-align: right;
    color: #b35331;
    font-weight: bold;
}

</style>

<body>
    <div class="nutrition">
        <h2>Nutrition</h2>
        <p>The table below shows nutritional values per serving without the additional fillings.</p>
        <table>
            <tr>
                <td>Calories</td>
                <td class="value">277kcal</td>
            </tr>
            <tr>
                <td>Carbs</td>
                <td class="value">0g</td>
            </tr>
            <tr>
                <td>Protein</td>
                <td class="value">20g</td>
            </tr>
            <tr>
                <td>Fat</td>
                <td class="value">22g</td>
            </tr>
        </table>
    </div>
</body>
</html>
